name: Measure watch work

# Counts the instructions the emulated watch executes around a minute change,
# a relight and an idle stretch, for the base and the proposed build, so a
# change meant to save energy shows what it actually saves (tools/energy/).
on:
  pull_request:
    paths:
      - 'watchface/src/c/**'
      - 'watchface/resources/**'
      - 'watchface/package.json'
      - 'tools/energy/**'
      - '.github/workflows/energy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: energy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        build: [before, after]
    env:
      TZ: UTC
      SDL_VIDEODRIVER: dummy
      QEMU_TRACE_DIR: /tmp/qemu-trace
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install pinned build tools
        run: |
          npm ci
          pip install pebble-tool==5.0.40
          pebble sdk install 4.33.1
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 libpixman-1-0 libfdt1
      # The measurement tools always come from this checkout; only the watch
      # build differs. The phone side is a stub, as in the emulator check.
      - name: Build the ${{ matrix.build }} watch face
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          src=.
          if [ "${{ matrix.build }}" = before ]; then git worktree add /tmp/base "$BASE"; src=/tmp/base; fi
          echo "Pebble.addEventListener('ready',function(){console.log('stub phone app');});" > $src/watchface/src/pkjs/index.js
          (cd $src/watchface && pebble build)
          if [ "$src" != . ]; then rm -rf watchface/build && cp -r $src/watchface/build watchface/build; fi
          (cd $src && git log -1 --format='%H %s')
      - name: Count instructions in the emulator
        run: |
          export QEMU_REAL="$(command -v qemu-pebble)"
          test -n "$QEMU_REAL" || { echo "::error::qemu-pebble not found"; exit 1; }
          export PEBBLE_QEMU_PATH="$GITHUB_WORKSPACE/tools/energy/qemu-trace.sh"
          mkdir -p "$QEMU_TRACE_DIR"
          (cd watchface && pebble install -vv --emulator emery build/watchface.pbw)
          sleep 15
          node tools/energy/measure.mjs ${{ matrix.build }} 3
          du -sh "$QEMU_TRACE_DIR"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: energy-${{ matrix.build }}
          path: test-results/energy/*.json
          retention-days: 30

  report:
    needs: measure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: energy-*
          merge-multiple: true
          path: energy
      - run: node tools/energy/report.mjs energy/before.json energy/after.json "$GITHUB_STEP_SUMMARY"
