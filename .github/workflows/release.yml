name: Verify and release watchface

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watchface-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install pinned build tools
        run: |
          npm ci
          pip install pebble-tool==5.0.40
          pebble sdk install 4.33.1
          npx playwright install --with-deps chromium
      - name: Build settings and run core tests
        run: |
          npm run companion
          npm test
          npm run build
      - name: Browser and phone-settings tests
        run: |
          npm run dev -- --port 5173 --strictPort > /tmp/dymaxion-vite.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/ > /dev/null && break; sleep 1; done
          npm run test:browser
      - name: Clean native build and package
        run: |
          cd watchface
          pebble clean
          pebble build
          cd ..
          python tools/release.py package
          python tools/release.py check
      - name: Verify release tag belongs to main
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python tools/release.py check --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dymaxion-release
          path: release-artifacts/
          if-no-files-found: error
      - name: Keep test screenshots on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: pebble-store-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dymaxion-release
          path: release-artifacts
      - run: pip install pebble-tool==5.0.40
      - name: Publish the verified package to Pebble
        env:
          PEBBLE_FIREBASE_REFRESH_TOKEN: ${{ secrets.PEBBLE_FIREBASE_REFRESH_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/release.py publish --tag "$RELEASE_TAG"
      - name: Publish GitHub release downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Dymaxion $RELEASE_TAG" --notes-file release-artifacts/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-artifacts/dymaxion.pbw release-artifacts/SHA256SUMS --clobber
