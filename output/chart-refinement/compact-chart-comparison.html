  <script>
    (() => {
      const root=document.getElementById('dymaxion-chart-refinement');
      const renders=JSON.parse(root.querySelector('[data-renders]').textContent);
      const example=root.querySelector('[data-example]'),detail=root.querySelector('[data-detail]');
      const state={example:'weather',detail:true};
      function fitPixels(){
        const scale=Math.max(1,Math.min(3,Math.floor(root.clientWidth/200)));
        root.style.setProperty('--pixel-width',200*scale+'px');
      }
      function draw(){
        example.value=state.example;detail.checked=state.detail;root.dataset.detail=String(state.detail);
        const entry=renders.find(r=>r.id===state.example),kind=state.detail?'chart':'watch';
        for(const stage of ['before','after']){
          const img=root.querySelector('[data-'+stage+']');img.src=entry[stage][kind];img.height=state.detail?44:228;
          img.alt=(stage==='before'?'Previous':'Refined')+' '+entry.name+', example data';
        }
        root.dataset.view=state.example+'/'+kind;fitPixels();
        root.querySelector('[data-status]').textContent=entry.name+', before and refined, '+(state.detail?'chart detail':'full watch');
      }
      function restore(saved){
        if(saved?.modelContent?.study!=='dymaxion-chart-refinement-v1')return;
        const value=saved.modelContent;
        if(renders.some(r=>r.id===value.example))state.example=value.example;
        if(typeof value.detail==='boolean')state.detail=value.detail;
        draw();
      }
      function changed(){
        state.example=example.value;state.detail=detail.checked;draw();
        if(window.openai?.setWidgetState)Promise.resolve(window.openai.setWidgetState({modelContent:{study:'dymaxion-chart-refinement-v1',...state},privateContent:null})).catch(()=>{});
      }
      example.addEventListener('change',changed);detail.addEventListener('change',changed);
      draw();restore(window.openai?.widgetState);
      new ResizeObserver(fitPixels).observe(root);
      window.addEventListener('openai:set_globals',event=>restore(event.detail?.globals?.widgetState));
    })();
  </script>
