    const grid = broadTriangleGrid(pitch, phase), cuts = [];
    depth = Math.max(0, Math.min(3, Number(depth) || 0));
    for (let slot = 0; slot < digits.length; slot++) for (const corner of CORNERS[digits[slot]]) {
      const right = corner[1] === "r", bottom = corner[0] === "b";
      const rect = {
        x0: starts[slot] + (right ? 33 : 0),
        x1: starts[slot] + (right ? 45 : 12),
        y0: capTop + (bottom ? 24 : 0),
        y1: capTop + (bottom ? 32 : 8)
      };
      const a = right ? -1 : 1, b = (bottom ? -1 : 1) / SQRT3;
      const offset = a * grid.originX + b * grid.originY + grid.edge / 2;
      let minimum = Infinity;
      const candidates = [];
      for (let y = rect.y0; y < rect.y1; y++) for (let x = rect.x0; x < rect.x1; x++) {
        const at = index(x, y);
        if (!original[at]) continue;
        const value = a * (x + 0.5) + b * (y + 0.5);
        candidates.push({ at, x, y, value });
        minimum = Math.min(minimum, value);
      }
      if (!candidates.length) continue;
      const c = offset + Math.ceil((minimum - offset + 1e-8) / grid.edge) * grid.edge;
      const distance = (c - minimum) / Math.hypot(a, b);
      if (distance > depth || distance < 0.2) continue;
      const clipped = candidates.filter((p) => p.value < c);
      if (clipped.length < 2) continue;
      for (const p of clipped) {
        mask[p.at] = 0;
        removed[p.at] = 1;
      }
      cuts.push({ slot, corner, a, b, c, distance, points: lineInRect(a, b, c, rect), pixels: clipped.length });
    }
    return { mask, removed, grid, cuts };
  }
  function drawBroadTime(ctx, time, x = 0, y = 0, {
    ink = "#000000",
    background = "#FFFFFF",

    cut = "#0055AA",
    trimmed = false,
    showGrid = false,
    pitch = 8,
    phase = 0,
    depth = 2
  } = {}) {
    const geometry = broadTimeGeometry(time);
    const result = trimBroadGeometry(geometry, { pitch, phase, depth });
    const display = trimmed ? result.mask : geometry.mask;
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = background;
    ctx.fillRect(0, 0, width, height);
    ctx.fillStyle = ink;
    for (let py = 0; py < height; py++) for (let px = 0; px < width; px++)
      if (display[index(px, py)]) ctx.fillRect(px, py, 1, 1);
    if (showGrid) {
      ctx.beginPath();
      ctx.rect(0, 0, width, height);
      ctx.clip();
      ctx.strokeStyle = guide;
      ctx.globalAlpha = 0.5;
      ctx.lineWidth = 0.25;

      for (const cell of result.grid.cells) {

        ctx.closePath();
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = cut;
      ctx.lineWidth = 0.7;
      ctx.beginPath();
      for (const segment of result.cuts) if (segment.points.length === 2) {
        ctx.moveTo(...segment.points[0]);
        ctx.lineTo(...segment.points[1]);
      }
      ctx.stroke();
    }
    ctx.restore();
    return { ...result, original: geometry.mask };
  }

  // output/broad-numeral-study/refined-study.js
  var root = document.getElementById("dymaxion-refined-type-study");
  var find = (name) => root.querySelector("[data-" + name + "]");
  var state = { time: "12:33", watchStyle: "rounded", palette: "paper", pitch: 8, phase: 0, depth: 2 };
  var choices = {
    time: ["12:33", "12:34", "23:32", "11:11", "06:57", "07:36", "08:08", "23:59", "00:00", "20:26"],
    watchStyle: ["rounded", "trimmed"],
    palette: ["paper", "dark"],
    pitch: [6, 8, 10],
    phase: [0, 0.5, 1]
  };
  var controls = {
    time: find("time"),
    watchStyle: find("watch-style"),
    palette: find("palette"),
    pitch: find("pitch"),
    phase: find("phase"),
    depth: find("depth")

  var bases = {};
  function paint() {
    find("depth-value").textContent = state.depth + " px";
    for (const [key, control] of Object.entries(controls)) control.value = state[key];
    let proof;
    for (const canvas2 of root.querySelectorAll("[data-strip]")) {
      const style = canvas2.dataset.strip, ctx2 = canvas2.getContext("2d");
      ctx2.setTransform(canvas2.width / 200, 0, 0, canvas2.height / 40, 0, 0);
      proof = drawBroadTime(ctx2, state.time, 0, 0, {
        ...state,
        trimmed: style === "trimmed",
        showGrid: style === "construction"
      });
      canvas2.setAttribute("aria-label", state.time + ", " + {
        rounded: "separate numerals with softly rounded terminals and a bold colon",
        construction: "equilateral construction grid with selected outline cuts",
        trimmed: "clean pixel outline after trimming"

    }
    const canvas = find("watch"), ctx = canvas.getContext("2d"), paper = state.palette === "paper";
    if (bases[state.palette]) ctx.drawImage(bases[state.palette], 0, 0);
    else {
      ctx.fillStyle = paper ? "#FFFFFF" : "#000000";
      ctx.fillRect(0, 0, 200, 228);
    }
    drawBroadTime(ctx, state.time, 0, 18, {
      ...state,
      ink: paper ? "#000000" : "#FFFFFF",
      background: paper ? "#FFFFFF" : "#000000",
      trimmed: state.watchStyle === "trimmed"
    });
    canvas.setAttribute("aria-label", state.time + " with " + state.watchStyle + " lettering on the 200 by 228 pixel watch");
    for (const canvas2 of root.querySelectorAll("[data-pair]")) {
      drawBroadTime(canvas2.getContext("2d"), canvas2.dataset.pair + ":00");
    }
    for (const canvas2 of root.querySelectorAll("[data-digits]")) {
      const ctx2 = canvas2.getContext("2d");
      ctx2.fillStyle = "#FFFFFF";
      ctx2.fillRect(0, 0, 250, 40);
      [...canvas2.dataset.digits].forEach((digit, index2) => drawBroadDigit(ctx2, digit, 2 + index2 * 50, 4));
    }

  }
  function restore(saved) {
    if (saved?.modelContent?.study !== "dymaxion-broad-v3") return;
    const values = saved.modelContent.settings;
    if (!values || typeof values !== "object") return;
    for (const key of Object.keys(state)) {
      if (choices[key]?.includes(values[key])) state[key] = values[key];
      else if (key === "depth" && Number.isFinite(values.depth) && values.depth >= 0 && values.depth <= 3) state.depth = values.depth;
    }
    paint();
  }
  function save() {
    if (window.openai?.setWidgetState) Promise.resolve(window.openai.setWidgetState({
      modelContent: { study: "dymaxion-broad-v3", settings: { ...state } },
      privateContent: null
    })).catch(() => {
    });
  }
  for (const [key, control] of Object.entries(controls)) control.addEventListener(key === "depth" ? "input" : "change", () => {
    state[key] = ["pitch", "phase", "depth"].includes(key) ? Number(control.value) : control.value;
    paint();
    save();
  });
  paint();
  restore(window.openai?.widgetState);
  window.addEventListener("openai:set_globals", (event) => restore(event.detail?.globals?.widgetState));
  for (const [key, src] of Object.entries(JSON.parse(find("watch-bases").textContent))) {
    const image = new Image();
    image.onload = () => {
      bases[key] = image;
      paint();
    };
    image.src = src;
  }
})();
